<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extensión Universitaria — Portal de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #fffdf8;
    --surface2: #f0ece2;
    --border: #ddd8cc;
    --text: #1a1714;
    --text-muted: #6b6560;
    --accent: #2d5a3d;
    --accent-light: #4a8c62;
    --accent-bg: #e8f2ec;
    --gold: #b8963e;
    --gold-bg: #faf3e0;
    --red: #8b3a3a;
    --red-bg: #fdf0f0;
    --blue: #2a4a7f;
    --blue-bg: #edf2fb;
    --purple: #5a3a7f;
    --purple-bg: #f3eefb;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a2f22 0%, #2d5a3d 50%, #1a2a38 100%);
    position: relative;
    overflow: hidden;
  }

  #auth-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 80%, rgba(184,150,62,0.15) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(45,90,61,0.3) 0%, transparent 50%);
  }

  .auth-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 48px 44px;
    width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
  }

  .auth-logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .auth-logo .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
  }

  .auth-logo h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--text);
    line-height: 1.2;
  }

  .auth-logo p {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 6px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(45,90,61,0.12);
    background: white;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(45,90,61,0.35); }
  .btn-primary:active { transform: translateY(0); }

  .auth-roles {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .auth-roles p {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .role-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .role-pill {
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .role-pill:hover, .role-pill.active {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
  }

  .error-msg {
    background: var(--red-bg);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ===== APP LAYOUT ===== */
  #app {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  /* TOPBAR */
  .topbar {
    background: var(--accent);
    color: white;
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: white;
    letter-spacing: -0.02em;
  }

  .topbar-badge {
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.15);
    padding: 6px 14px 6px 8px;
    border-radius: 99px;
    cursor: pointer;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .user-chip-info { line-height: 1.2; }
  .user-chip-name { font-size: 13px; font-weight: 600; color: white; }
  .user-chip-role { font-size: 11px; color: rgba(255,255,255,0.7); }

  .btn-logout {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.25); }

  /* MAIN LAYOUT */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    overflow-y: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    padding: 12px 12px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.15s;
    text-decoration: none;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item .nav-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .nav-item:hover { background: var(--bg); color: var(--text); }

  .nav-item.active {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 600;
  }

  .nav-item.active .nav-icon { background: var(--accent); }

  .nav-count {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    min-width: 20px;
    text-align: center;
  }

  /* CONTENT AREA */
  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
  }

  /* PAGE HEADER */
  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .page-title-area h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 30px;
    color: var(--text);
    line-height: 1.1;
  }

  .page-title-area p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .btn-new {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-new:hover { background: var(--accent-light); transform: translateY(-1px); }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid var(--border);
  }

  .stat-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    line-height: 1;
    color: var(--text);
  }

  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* FILTERS BAR */
  .filters-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 9px 16px 9px 38px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    position: relative;
  }
  .search-input:focus { border-color: var(--accent); }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    pointer-events: none;
  }

  .filter-select {
    padding: 9px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .filter-select:focus { border-color: var(--accent); }

  /* TABLE */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
  }

  .data-table th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  .data-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }

  .data-table tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: var(--bg); }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-green { background: var(--accent-bg); color: var(--accent); }
  .badge-gold { background: var(--gold-bg); color: var(--gold); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); }
  .badge-gray { background: var(--surface2); color: var(--text-muted); }

  .action-btn {
    padding: 5px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 20px;
    padding: 36px 40px;
    width: 560px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { transform: translateY(16px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .modal-header h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
  }

  .modal-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-footer {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .btn-secondary {
    padding: 10px 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  .btn-save {
    padding: 10px 24px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-save:hover { background: var(--accent-light); }

  /* DASHBOARD GRID */
  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 24px;
  }

  .dash-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 24px;
  }

  .dash-card h4 {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .recent-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .recent-item:last-child { border-bottom: none; }

  .recent-item-title {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .recent-item-sub { color: var(--text-muted); font-size: 12px; }

  .area-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1.5px solid transparent;
  }
  .area-card:hover { border-color: var(--accent); background: var(--accent-bg); }

  .area-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .area-card-info h5 { font-size: 14px; font-weight: 600; }
  .area-card-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* NO DATA */
  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .no-data .no-data-icon { font-size: 40px; margin-bottom: 12px; }
  .no-data h4 { font-size: 16px; margin-bottom: 6px; color: var(--text); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: white;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--accent); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ADMIN PANEL */
  .user-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .big-avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .user-info h5 { font-size: 15px; font-weight: 600; }
  .user-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .user-card-actions { margin-left: auto; display: flex; gap: 8px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🎓</div>
      <h1>Extensión Universitaria</h1>
      <p>Portal de Gestión Institucional</p>
    </div>

    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="Tu nombre de usuario" value="admin">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" value="1234">
    </div>

    <button class="btn-primary" onclick="doLogin()">Ingresar al Portal</button>

    <div class="error-msg" id="auth-error">Usuario o contraseña incorrectos.</div>

    <div class="auth-roles">
      <p>Demo rápido — elegí un perfil</p>
      <div class="role-pills">
        <span class="role-pill" onclick="setDemo('admin','1234','admin')">Administrador</span>
        <span class="role-pill" onclick="setDemo('coordinador','1234','coordinador')">Coordinador</span>
        <span class="role-pill" onclick="setDemo('usuario','1234','usuario')">Usuario</span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">Extensión Universitaria</span>
      <span class="topbar-badge" id="topbar-role-badge">Admin</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="topbar-avatar">A</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="topbar-name">Administrador</div>
          <div class="user-chip-role" id="topbar-role">Administrador</div>
        </div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="main-layout">
    <nav class="sidebar">
      <div class="sidebar-section-label">Principal</div>

// ============================================================
// AUTH
// ============================================================
function setDemo(user, pass, role) {
  document.getElementById('login-user').value = user;
  document.getElementById('login-pass').value = pass;
  document.querySelectorAll('.role-pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const found = USERS_DB.find(x => x.username === u && x.password === p);
  if (!found) {
    document.getElementById('auth-error').style.display = 'block';
    return;
  }
  document.getElementById('auth-error').style.display = 'none';
  state.currentUser = found;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  // topbar
  document.getElementById('topbar-name').textContent = found.nombre;
  document.getElementById('topbar-role').textContent = capitalize(found.role);
  document.getElementById('topbar-badge').textContent = capitalize(found.role);
  document.getElementById('topbar-avatar').textContent = found.avatar;

  // admin nav
  if (found.role === 'admin') {
    document.getElementById('admin-section').style.display = 'block';
    document.getElementById('nav-users').style.display = 'flex';
  }

  updateCounts();
  showPage('dashboard');
}

function doLogout() {
  state.currentUser = null;
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ============================================================
// NAVIGATION
// ============================================================
function showPage(page) {
  state.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = { dashboard:'dashboard', becas:'becas', proyectos:'proyectos', pasantias:'pasantias', convenios:'convenios', contratos:'contratos', usuarios:'usuarios' };
  const buttons = document.querySelectorAll('.nav-item');
  buttons.forEach(b => { if (b.textContent.toLowerCase().includes(page.toLowerCase())) b.classList.add('active'); });
  
  const pages = { dashboard: renderDashboard, becas: renderBecas, proyectos: renderProyectos,
    pasantias: renderPasantias, convenios: renderConvenios, contratos: renderContratos, usuarios: renderUsuarios };
  if (pages[page]) document.getElementById('content-area').innerHTML = pages[page]();
}

function updateCounts() {
  ['becas','proyectos','pasantias','convenios','contratos'].forEach(k => {
    const el = document.getElementById('cnt-'+k);
    if (el) el.textContent = state.data[k].length;
  });
}

}

let currentModalType = null;

function openModal(type) {
  currentModalType = type;
  const form = modalForms[type];
  document.getElementById('modal-title').textContent = form.title;
  document.getElementById('modal-body').innerHTML = form.fields;
  document.getElementById('modal-save-btn').onclick = () => { form.save(); closeModal(); };
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

// ============================================================
// TABLE FILTER
// ============================================================
function filterTable(input, tableId, col) {
  const val = (input.value || '').toLowerCase();
  const rows = document.querySelectorAll(`#${tableId} tbody tr`);
  rows.forEach(r => {
    const cell = r.cells[col];
    r.style.display = (!val || (cell && cell.textContent.toLowerCase().includes(val))) ? '' : 'none';
  });
}

function deleteRow(area, id) {
  if (!confirm('¿Eliminar este registro?')) return;
  state.data[area] = state.data[area].filter(x => x.id !== id);
  updateCounts();
  showPage(area);
  toast('Registro eliminado');
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2800);
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Enter key on login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('auth-screen').style.display !== 'none') doLogin();
});
