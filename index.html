<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Extensión Universitaria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --ink:        #0f1117;
  --ink-soft:   #3a3d4a;
  --ink-muted:  #7a7f8e;
  --paper:      #fafaf8;
  --paper2:     #f2f1ed;
  --paper3:     #e8e6df;
  --line:       #dedad1;
  --forest:     #1e4d35;
  --forest-mid: #2e7352;
  --forest-lit: #43a872;
  --forest-bg:  #ebf5f0;
  --gold:       #c17f24;
  --gold-bg:    #fdf5e8;
  --ruby:       #a0293a;
  --ruby-bg:    #fdf0f2;
  --sapphire:   #1d3f7a;
  --sapphire-bg:#edf1fb;
  --violet:     #5b2d8e;
  --violet-bg:  #f3edfb;
  --teal:       #1a6b6b;
  --teal-bg:    #e6f4f4;
  --r:          10px;
  --r-lg:       16px;
  --shadow:     0 1px 8px rgba(0,0,0,.08), 0 4px 20px rgba(0,0,0,.05);
  --shadow-lg:  0 8px 40px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── AUTH ── */
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:var(--forest);
  background-image:
    radial-gradient(ellipse 80% 60% at 10% 90%, rgba(67,168,114,.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 10%, rgba(193,127,36,.12) 0%, transparent 60%);
}
.auth-wrap{background:var(--paper);border-radius:20px;padding:52px 48px;width:440px;max-width:95vw;box-shadow:var(--shadow-lg)}
.auth-brand{text-align:center;margin-bottom:40px}
.auth-seal{width:68px;height:68px;background:var(--forest);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;box-shadow:0 4px 20px rgba(30,77,53,.35)}
.auth-brand h1{font-family:'Playfair Display',serif;font-size:22px;line-height:1.2;color:var(--ink)}
.auth-brand p{color:var(--ink-muted);font-size:13px;margin-top:5px}
.fgroup{margin-bottom:16px}
.fgroup label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px}
.fgroup input,.fgroup select,.fgroup textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:var(--paper2);color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
.fgroup input:focus,.fgroup select:focus,.fgroup textarea:focus{border-color:var(--forest-mid);box-shadow:0 0 0 3px rgba(46,115,82,.13);background:#fff}
.fgroup textarea{resize:vertical;min-height:80px}
.btn-primary{width:100%;padding:13px;background:var(--forest);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:6px;letter-spacing:.02em}
.btn-primary:hover{background:var(--forest-mid);box-shadow:0 4px 16px rgba(30,77,53,.3);transform:translateY(-1px)}
.auth-demo{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.auth-demo p{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);margin-bottom:10px;font-weight:600}
.demo-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dpill{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink-muted);transition:all .15s}
.dpill:hover,.dpill.on{border-color:var(--forest-mid);background:var(--forest-bg);color:var(--forest)}
.auth-err{background:var(--ruby-bg);color:var(--ruby);padding:9px 14px;border-radius:8px;font-size:13px;margin-top:10px;display:none}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:column}
.topbar{background:var(--forest);height:58px;display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.tb-logo{font-family:'Playfair Display',serif;font-size:17px;color:#fff;white-space:nowrap}
.tb-sep{width:1px;height:22px;background:rgba(255,255,255,.2)}
.tb-badge{background:rgba(255,255,255,.18);color:#fff;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-user{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.13);padding:5px 12px 5px 6px;border-radius:99px}
.tb-av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace}
.tb-uname{font-size:13px;font-weight:500;color:#fff}
.tb-urole{font-size:10px;color:rgba(255,255,255,.65)}
.btn-logout{background:rgba(255,255,255,.13);border:none;color:rgba(255,255,255,.85);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:background .15s}
.btn-logout:hover{background:rgba(255,255,255,.22)}

.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:228px;background:#fff;border-right:1px solid var(--line);padding:20px 12px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.sb-label{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);padding:12px 10px 5px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-soft);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'IBM Plex Sans',sans-serif}
.nav-btn .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:background .15s}
.nav-btn:hover{background:var(--paper2);color:var(--ink)}
.nav-btn.active{background:var(--forest-bg);color:var(--forest);font-weight:600}
.nav-btn.active .ico{background:var(--forest);font-size:15px}
.nav-cnt{margin-left:auto;background:var(--forest);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;font-family:'IBM Plex Mono',monospace}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:28px 32px}

/* ── PAGE HEADER ── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px}
.ph-left h2{font-family:'Playfair Display',serif;font-size:26px;line-height:1.1;color:var(--ink)}
.ph-left p{color:var(--ink-muted);font-size:13px;margin-top:5px}
.ph-right{display:flex;gap:8px;flex-shrink:0}
.btn-new{display:flex;align-items:center;gap:7px;padding:9px 16px;background:var(--forest);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-new:hover{background:var(--forest-mid);transform:translateY(-1px)}
.btn-report{display:flex;align-items:center;gap:6px;padding:9px 14px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:all .15s;white-space:nowrap}
.btn-report:hover{border-color:var(--forest-mid);color:var(--forest);background:var(--forest-bg)}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.scard{background:#fff;border-radius:var(--r);padding:16px 18px;border:1px solid var(--line)}
.scard-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
.scard-val{font-family:'Playfair Display',serif;font-size:32px;line-height:1;color:var(--ink)}
.scard-sub{font-size:11px;color:var(--ink-muted);margin-top:3px}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-muted);pointer-events:none;line-height:1}
.search-inp{width:100%;padding:9px 14px 9px 34px;border:1.5px solid var(--line);border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#fff;color:var(--ink);outline:none;transition:border .2s}
.search-inp:focus{border-color:var(--forest-mid)}
.fsel{padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#fff;color:var(--ink);outline:none;cursor:pointer;transition:border .2s}
.fsel:focus{border-color:var(--forest-mid)}

/* ── TABLE ── */
.tbl-wrap{background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);overflow:auto}
.dtbl{width:100%;border-collapse:collapse;min-width:700px}
.dtbl th{background:var(--paper2);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--line);white-space:nowrap}
.dtbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.dtbl tbody tr:last-child td{border-bottom:none}
.dtbl tbody tr:hover{background:var(--paper)}
.dtbl tbody tr.hidden-row{display:none}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.b-green{background:var(--forest-bg);color:var(--forest)}
.b-gold{background:var(--gold-bg);color:var(--gold)}
.b-red{background:var(--ruby-bg);color:var(--ruby)}
.b-blue{background:var(--sapphire-bg);color:var(--sapphire)}
.b-violet{background:var(--violet-bg);color:var(--violet)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
.b-gray{background:var(--paper3);color:var(--ink-muted)}

/* ── ROW ACTIONS ── */
.row-actions{display:flex;gap:6px}
.btn-sm{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink-muted);font-family:'IBM Plex Sans',sans-serif;transition:all .15s;white-space:nowrap}
.btn-sm:hover{border-color:var(--forest-mid);color:var(--forest);background:var(--forest-bg)}
.btn-sm.del:hover{border-color:var(--ruby);color:var(--ruby);background:var(--ruby-bg)}

/* ── FILE BADGE ── */
.fbadge{display:inline-flex;align-items:center;gap:4px;background:var(--forest-bg);color:var(--forest);font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;cursor:pointer;border:none;font-family:'IBM Plex Sans',sans-serif;transition:all .15s;white-space:nowrap}
.fbadge:hover{background:var(--forest);color:#fff}
.fbadge.empty{background:var(--paper3);color:var(--ink-muted)}
.fbadge.empty:hover{background:var(--line);color:var(--ink)}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,17,23,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:0;width:580px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:mIn .2s ease}
.modal.wide{width:680px}
@keyframes mIn{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:24px 28px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h3{font-family:'Playfair Display',serif;font-size:20px}
.modal-x{width:32px;height:32px;border-radius:50%;border:none;background:var(--paper2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-x:hover{background:var(--line)}
.modal-body{padding:24px 28px;overflow-y:auto;flex:1}
.modal-foot{padding:18px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.btn-cancel{padding:9px 18px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-muted);transition:all .15s}
.btn-cancel:hover{border-color:var(--ink-muted);color:var(--ink)}
.btn-save{padding:9px 22px;background:var(--forest);color:#fff;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-save:hover{background:var(--forest-mid)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── FILE PANEL ── */
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--paper2);position:relative;margin-bottom:16px}
.drop-zone:hover,.drop-zone.over{border-color:var(--forest-mid);background:var(--forest-bg)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-ico{font-size:32px;margin-bottom:8px}
.drop-txt{font-size:13px;color:var(--ink-muted)}
.drop-txt strong{color:var(--forest)}
.flist{display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.fitem-ico{width:34px;height:34px;border-radius:8px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.fitem-info{flex:1;min-width:0}
.fitem-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem-meta{font-size:10px;color:var(--ink-muted);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.fitem-acts{display:flex;gap:5px;flex-shrink:0}
.no-files{text-align:center;padding:24px;color:var(--ink-muted);font-size:13px}

/* ── DASHBOARD ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.dcard{background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);padding:22px}
.dcard h4{font-family:'Playfair Display',serif;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.area-row{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--paper);border-radius:var(--r);margin-bottom:8px;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.area-row:hover{border-color:var(--forest-mid);background:var(--forest-bg)}
.area-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.area-info h5{font-size:13px;font-weight:600}
.area-info p{font-size:11px;color:var(--ink-muted);margin-top:1px}
.rec-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.rec-item:last-child{border-bottom:none}
.rec-title{font-weight:600;font-size:13px}
.rec-sub{color:var(--ink-muted);margin-top:1px;font-size:11px}

/* ── USER PANEL ── */
.ucard{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px}
.uav{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;font-family:'IBM Plex Mono',monospace}
.uinfo h5{font-size:14px;font-weight:600}
.uinfo p{font-size:11px;color:var(--ink-muted);margin-top:2px}
.ucard-r{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── NO DATA ── */
.nodata{text-align:center;padding:52px 20px}
.nodata-ico{font-size:36px;margin-bottom:10px}
.nodata h4{font-size:15px;color:var(--ink)}
.nodata p{font-size:12px;color:var(--ink-muted);margin-top:4px}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);transform:translateY(60px);opacity:0;transition:all .28s;z-index:999;max-width:340px}
.toast.show{transform:none;opacity:1}
.toast.ok{background:var(--forest)}
.toast.err{background:var(--ruby)}

/* ── REPORT DROPDOWN ── */
.report-menu{position:relative;display:inline-block}
.report-dd{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:160px;z-index:50;overflow:hidden;display:none}
.report-menu.open .report-dd{display:block}
.report-dd button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:none;background:none;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:background .15s;text-align:left}
.report-dd button:hover{background:var(--paper2)}
</style>
</head>
<body>

<!-- ===== AUTH ===== -->
<div id="auth">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-seal">🎓</div>
      <h1>Extensión Universitaria</h1>
      <p>Portal de Gestión Institucional</p>
    </div>
    <div class="fgroup"><label>Usuario</label><input id="lu" type="text" placeholder="Tu usuario" value="admin" autocomplete="username"></div>
    <div class="fgroup"><label>Contraseña</label><input id="lp" type="password" placeholder="••••••••" value="1234" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="doLogin()">Ingresar</button>
    <div class="auth-err" id="aerr">Usuario o contraseña incorrectos.</div>
    <div class="auth-demo">
      <p>Demo rápido</p>
      <div class="demo-pills">
        <span class="dpill" onclick="setDemo('admin','admin')">Administrador</span>
        <span class="dpill" onclick="setDemo('coordinador','coordinador')">Coordinador</span>
      </div>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <header class="topbar">
    <span class="tb-logo">Extensión Universitaria</span>
    <div class="tb-sep"></div>
    <span class="tb-badge" id="tb-badge">Admin</span>
    <div class="tb-right">
      <div class="tb-user">
        <div class="tb-av" id="tb-av">M</div>
        <div>
          <div class="tb-uname" id="tb-uname">Mariana</div>
          <div class="tb-urole" id="tb-urole">Administrador</div>
        </div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sb-label">Principal</div>
      <button class="nav-btn active" onclick="go('dashboard')">
        <div class="ico" style="background:var(--paper2)">📊</div>Dashboard
      </button>

      <div class="sb-label">Áreas</div>
      <button class="nav-btn" onclick="go('becas')">
        <div class="ico" style="background:var(--gold-bg)">🎓</div>Becas Estudiantiles
        <span class="nav-cnt" id="c-becas">0</span>
      </button>
      <button class="nav-btn" onclick="go('rrhh')">
        <div class="ico" style="background:var(--sapphire-bg)">👥</div>Recursos Humanos
        <span class="nav-cnt" id="c-rrhh">0</span>
      </button>
      <button class="nav-btn" onclick="go('propiedad')">
        <div class="ico" style="background:var(--violet-bg)">💡</div>Prop. Intelectual
        <span class="nav-cnt" id="c-propiedad">0</span>
      </button>
      <button class="nav-btn" onclick="go('proyectos')">
        <div class="ico" style="background:var(--forest-bg)">🧪</div>Proyectos
        <span class="nav-cnt" id="c-proyectos">0</span>
      </button>
      <button class="nav-btn" onclick="go('pasantias')">
        <div class="ico" style="background:var(--teal-bg)">💼</div>Pasantías
        <span class="nav-cnt" id="c-pasantias">0</span>
      </button>
      <button class="nav-btn" onclick="go('convenios')">
        <div class="ico" style="background:var(--ruby-bg)">🤝</div>Convenios
        <span class="nav-cnt" id="c-convenios">0</span>
      </button>

function bStatus(s) {
  const m={'Activa':'b-green','Activo':'b-green','Vigente':'b-green','En curso':'b-green','Registrado':'b-green',
    'En revisión':'b-gold','En trámite':'b-gold','Formulación':'b-gold','En negociación':'b-gold',
    'Finalizada':'b-gray','Finalizado':'b-gray','Vencido':'b-gray','Inactivo':'b-gray',
    'Cancelada':'b-red','Cancelado':'b-red'};
  return `<span class="badge ${m[s]||'b-gray'}">${s}</span>`;
}

function fKey(area,id){return `${area}_${id}`}
function getFiles(area,id){return S.files[fKey(area,id)]||[]}
function fbadge(area,id){
  const n=getFiles(area,id).length;
  return `<button class="fbadge${n===0?' empty':''}" onclick="openFiles('${area}',${id})">📎 ${n===0?'Adjuntar':`${n} archivo${n!==1?'s':''}`}</button>`;
}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}
function fIcon(t){if(!t)return'📄';if(t.includes('pdf'))return'📕';if(t.includes('word')||t.includes('document'))return'📘';if(t.includes('image'))return'🖼️';if(t.includes('sheet')||t.includes('excel')||t.includes('csv'))return'📗';if(t.includes('zip'))return'🗜️';if(t.includes('text'))return'📝';return'📄'}
function nodata(a){return`<div class="nodata"><div class="nodata-ico">📭</div><h4>Sin registros</h4><p>Hacé clic en "+ Nuevo" para agregar el primer registro en ${a}.</p></div>`}

function filterRows(inp, tid) {

}

  _editId = editId;
  const F = FORMS[type];
  document.getElementById('modal-title').textContent = editId ? F.title.replace('Nuevo ','Editar ').replace('Nueva ','Editar ') : F.title;
  document.getElementById('modal-body').innerHTML = F.fields;
  document.getElementById('modal-foot').style.display='';
  document.getElementById('modal-save').onclick = ()=>saveForm(type);

  // populate for edit
  if (editId && F.area) {
    const rec = S.data[F.area].find(r=>r.id==editId);
    if (rec) F.keys.forEach((k,i)=>{const el=document.getElementById('f'+i);if(el)el.value=rec[k]||''});
  }
  document.getElementById('overlay').classList.add('open');
}

function saveForm(type) {
  const F = FORMS[type];
  for (const i of F.required) {
    const el=document.getElementById('f'+i);
    if (!el||!el.value.trim()) { showToast('Completá los campos obligatorios','err'); return; }
  }

  if (type==='usuario') {
    const n=gv('f0'),u=gv('f1'),p=gv('f2'),r=gv('f3');
    const initials=n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    USERS.push({id:Date.now(),username:u,pass:p,nombre:n,role:r,av:initials,color:'#888'});
    closeModal(); go('usuarios'); showToast('Usuario creado ✓'); return;
  }

  const obj={id:_editId||Date.now()};
  F.keys.forEach((k,i)=>{ obj[k]=gv('f'+i); });

  if (_editId) {
    const idx=S.data[F.area].findIndex(r=>r.id==_editId);
    if(idx>-1) S.data[F.area][idx]=obj;
    showToast('Registro actualizado ✓');
  } else {
    S.data[F.area].push(obj);
    showToast('Registro creado ✓');
  }
  refreshCounts(); closeModal(); go(F.area);
}

function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}

function delRow(area, id) {
  if(!confirm('¿Eliminar este registro?')) return;
  S.data[area]=S.data[area].filter(r=>r.id!=id);
  refreshCounts(); go(area); showToast('Registro eliminado');
}

// ══════════════════════════════════════════════
// FILE ATTACHMENTS
// ══════════════════════════════════════════════
function openFiles(area, id) {
  const key=fKey(area,id);
  if(!S.files[key]) S.files[key]=[];
  const meta=AREA_META[area];
  const rec=S.data[area].find(r=>r.id==id);
  const recName=rec?(rec.nombre||rec.titulo||rec.institucion||`#${id}`):`#${id}`;

  document.getElementById('modal-title').textContent=`📎 Archivos — ${recName}`;
  document.getElementById('modal-foot').style.display='none';
  document.getElementById('modal').classList.add('wide');
  document.getElementById('modal-body').innerHTML=`
    <div class="drop-zone" id="dz">
      <input type="file" id="fi" multiple onchange="handleFiles(event,'${area}',${id})">
      <div class="drop-ico">☁️</div>
      <div class="drop-txt"><strong>Hacé clic o arrastrá archivos aquí</strong><br>Cualquier tipo de archivo · Sin límite de cantidad<br><small style="color:var(--ink-muted);margin-top:4px;display:block">⚠️ Los archivos se guardan en memoria hasta conectar Google Drive</small></div>
    </div>
    <div class="flist" id="fl-${key}">${renderFiles(area,id)}</div>`;

  setTimeout(()=>{
    const dz=document.getElementById('dz');
    if(!dz) return;
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files,area,id)});
  },60);

  document.getElementById('overlay').classList.add('open');
}

function renderFiles(area,id){
  const files=getFiles(area,id);
  if(!files.length) return`<div class="no-files">Sin archivos adjuntos todavía.</div>`;
  return files.map((f,i)=>`<div class="fitem">
    <div class="fitem-ico">${fIcon(f.type)}</div>
    <div class="fitem-info">
      <div class="fitem-name" title="${f.name}">${f.name}</div>
      <div class="fitem-meta">${fmtSize(f.size)} · ${f.by} · ${f.at}</div>
    </div>
    <div class="fitem-acts">
      <button class="btn-sm" onclick="dlFile('${area}',${id},${i})">⬇ Descargar</button>
      <button class="btn-sm del" onclick="rmFile('${area}',${id},${i})">✕</button>
    </div>
  </div>`).join('');
}

function handleFiles(e,area,id){addFiles(e.target.files,area,id)}

function addFiles(fileList,area,id){
  const key=fKey(area,id);
  if(!S.files[key]) S.files[key]=[];
  const now=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  let done=0;
  Array.from(fileList).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      S.files[key].push({name:file.name,size:file.size,type:file.type,dataUrl:e.target.result,by:S.user.nombre,at:now});
      done++;
      if(done===fileList.length){
        const fl=document.getElementById(`fl-${key}`);
        if(fl) fl.innerHTML=renderFiles(area,id);
        showToast(`${done} archivo${done!==1?'s':''} adjunto${done!==1?'s':''} ✓`);
      }
    };
    r.readAsDataURL(file);
  });
}

function dlFile(area,id,i){
  const f=getFiles(area,id)[i]; if(!f) return;
  const a=document.createElement('a'); a.href=f.dataUrl; a.download=f.name; a.click();
}

function rmFile(area,id,i){
  if(!confirm('¿Eliminar este archivo?')) return;
  S.files[fKey(area,id)].splice(i,1);
  const fl=document.getElementById(`fl-${fKey(area,id)}`);
  if(fl) fl.innerHTML=renderFiles(area,id);
  showToast('Archivo eliminado');
}

// ══════════════════════════════════════════════
// REPORTS — EXCEL & PDF
// ══════════════════════════════════════════════
function reportBtn(area){
  return`<div class="report-menu" id="rm-${area}">
    <button class="btn-report" onclick="toggleReport('${area}')">📊 Exportar ▾</button>
    <div class="report-dd">
      <button onclick="exportExcel('${area}')">📗 Descargar Excel</button>
      <button onclick="exportPDF('${area}')">📕 Descargar PDF</button>
    </div>
  </div>`;
}

function toggleReport(area){
  const m=document.getElementById('rm-'+area);
  document.querySelectorAll('.report-menu.open').forEach(x=>{if(x!==m)x.classList.remove('open')});
  m.classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.report-menu')) document.querySelectorAll('.report-menu.open').forEach(m=>m.classList.remove('open'));
});

const HEADERS = {
  becas:     ['Nombre','DNI','Carrera','Tipo','Monto','Estado','Inicio','Responsable','Obs'],
  rrhh_beca:     ['Nombre','DNI','Categoría','Dedicación','Estado','Resolución','Inicio','Obs'],
  rrhh_contrato: ['Nombre','DNI','Cargo','Monto','Estado','Inicio','Fin','Obs'],
  rrhh_codigo:   ['Nombre','DNI','Código','Categoría','Dedicación','Estado','Inicio','Obs'],
  propiedad: ['Título','Tipo','Estado','Autores','Nro.Expediente','Fecha','Obs'],
  proyectos: ['Nombre','Área','Director','Estado','Financiamiento','Inicio','Fin','Obs'],
  pasantias: ['Nombre','DNI','Carrera','Empresa','Tutor','Estado','Inicio','Fin','Obs'],
  convenios: ['Institución','Tipo','Estado','Firma','Vencimiento','Responsable','Obs'],
};

function getRows(area){
  const keys=FORMS[Object.keys(FORMS).find(k=>FORMS[k].area===area)]?.keys||[];
  return S.data[area].map(r=>keys.map(k=>r[k]||''));
}

function exportExcel(area){
  const meta=AREA_META[area];
  const wb=XLSX.utils.book_new();
  const data=[HEADERS[area],...getRows(area)];
  const ws=XLSX.utils.aoa_to_sheet(data);
  // style header row width
  ws['!cols']=HEADERS[area].map(()=>({wch:20}));
  XLSX.utils.book_append_sheet(wb,ws,meta.label);
  XLSX.writeFile(wb,`${meta.label.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel descargado ✓');
}

function exportPDF(area){
  const meta=AREA_META[area];
  const rows=getRows(area);
  const hdrs=HEADERS[area];
  const date=new Date().toLocaleDateString('es-AR');

  // Build minimal PDF using plain text layout (no external lib needed)
  const colW=Math.floor(190/hdrs.length);
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    body{font-family:Arial,sans-serif;font-size:11px;margin:20px;color:#111}
    h1{font-size:16px;margin-bottom:4px}p{color:#666;font-size:10px;margin-bottom:14px}
    table{width:100%;border-collapse:collapse}
    th{background:#1e4d35;color:#fff;padding:6px 8px;text-align:left;font-size:10px}
    td{padding:5px 8px;border-bottom:1px solid #e0e0e0;font-size:10px}
    tr:nth-child(even)td{background:#f8f8f8}
    .footer{margin-top:16px;font-size:9px;color:#999;text-align:right}
  </style></head><body>
  <h1>${meta.icon} ${meta.label} — Reporte</h1>
  <p>Generado el ${date} · Secretaría de Extensión Universitaria · ${rows.length} registro${rows.length!==1?'s':''}</p>
  <table><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <div class="footer">Portal de Extensión Universitaria</div>
  </body></html>`;

  const w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(()=>{ w.print(); }, 400);
  showToast('PDF listo para imprimir ✓');
}

function filterByCol(sel,tid,col){
  const v=(sel.value||'').toLowerCase();
  document.querySelectorAll(`#${tid} tbody tr`).forEach(r=>{
    const cell=r.cells[col];
    const match=!v||(cell&&cell.textContent.toLowerCase().includes(v));
    if(!match) r.classList.add('hidden-row'); else r.classList.remove('hidden-row');
  });
}

// ══════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('wide');
  document.getElementById('modal-foot').style.display='';
  if(S.page&&!['dashboard','usuarios'].includes(S.page)) go(S.page);
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast show ${type}`;
  setTimeout(()=>t.className='toast',3000);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('auth').style.display!=='none') doLogin();
